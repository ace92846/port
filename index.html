<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <meta
        name="description"
        content="drew — developer and designer"
    >

    <title>pluto</title>

    <link
        rel="preconnect"
        href="https://cdnjs.cloudflare.com"
        crossorigin
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- =========================================
         CUSTOM CURSOR
    ========================================== -->

    <div
        class="cursor-dot"
        aria-hidden="true"
    ></div>


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div
        class="background-effects"
        aria-hidden="true"
    >

        <div class="large-blue-glow"></div>

        <div class="background-vignette"></div>

    </div>


    <!-- =========================================
         LANDING PAGE
    ========================================== -->

    <main class="landing">

        <div class="landing-content">

            <!-- Profile -->

            <div class="avatar-container">

                <div class="avatar">

                    <img
                        src="https://images-ext-1.discordapp.net/external/OE65IGLA2cz2ib3VVgpwAOwzZ6iLR5w1n9BNJKlu78A/https/i.imgur.com/b2wXCHfh.jpg?format=webp"
                        alt="Profile picture"
                        width="125"
                        height="125"
                        fetchpriority="high"
                        decoding="async"
                    >

                </div>

            </div>


            <!-- Name -->

            <h1>
                drew
            </h1>


            <!-- Description -->

            <p class="description">
                developer and designer
            </p>


            <!-- Portfolio -->

            <a
                href="#more"
                class="more-button"
                aria-label="Scroll to Portfolio section"
            >

                <span>
                    Portfolio
                </span>

                <i
                    class="fa-solid fa-arrow-down"
                    aria-hidden="true"
                ></i>

            </a>

        </div>


        <!-- Scroll indicator -->

        <a
            href="#more"
            class="scroll"
            aria-label="Scroll for more"
        >

            <span>
                Scroll for more
            </span>

            <i
                class="fa-solid fa-chevron-down"
                aria-hidden="true"
            ></i>

        </a>

    </main>


    <!-- =========================================
         PORTFOLIO SECTION
    ========================================== -->

    <section
        id="more"
        class="more-section"
    >

        <div class="more-content">

            <h2>
                You deserve to know me.
            </h2>

            <p>
                View my custom-created portfolio below
            </p>

            <a
                href="https://drewsportfolio.carrd.co/"
                target="_blank"
                rel="noopener noreferrer"
                class="portfolio-button"
            >

                <span>
                    Portfolio
                </span>

            </a>

        </div>

    </section>


    <script
        src="script.js"
        defer
    ></script>

</body>

</html>
